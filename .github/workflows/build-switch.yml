# 在云端构建红果短剧的 Switch .nro
#
# 为什么用 CI 而不是本机：
#   1. devkitPro 官方源 pkg.devkitpro.org 被 Cloudflare 按 TLS 指纹拦截，
#      本机网络下所有路径都是 403。GitHub 的构建机没有这个限制。
#   2. 生成「装到主页」用的 NSP forwarder 需要 hacbrewpack，而那是个
#      Linux x86_64 的可执行文件，macOS 上根本跑不了。
# 这两件事都只在 Linux 上能解决，所以构建放这里。
#
# 用法：推到 GitHub 即自动构建，产物在 Actions 的 Artifacts 里；
#       打 v* 标签会自动创建附带 .nro 的 Release。

name: 构建 Switch

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ⚠ 必须显式声明。仓库的默认工作流权限是 read（settings → Actions →
#   General → Workflow permissions），不写这块的话 GITHUB_TOKEN 是只读的，
#   "附加到 Release" 会以 403 "Resource not accessible by integration" 失败 ——
#   而且是在 .nro 已经构建成功、只是最后一步挂不上去的时候才炸，很误导。
permissions:
  contents: write

jobs:
  build-nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    env:
      DEVKITPRO: /opt/devkitpro

    steps:
      - uses: actions/checkout@v4

      # 镜像自带 devkitA64、libnx，**以及下面这一整串依赖**。
      # 这一点是从成功那次的日志里核实的：所有包都是
      # "is up to date -- skipping ... there is nothing to do"，一个字节都没下载。
      #
      # 所以这里先用本地数据库判断（dkp-pacman -Q 不联网），齐全就完全不碰网络。
      # 以前每次都无条件 `-Sy`，而 pkg.devkitpro.org 会被 Cloudflare 按 TLS 指纹
      # 间歇性返回 403 —— 同一天里同样的代码，有的构建过、有的六次重试全 403，
      # 整次构建白跑。既然同步只起到"更新版本号"的作用，那就没必要为它冒险。
      # 只有镜像换代、真缺包时，才退回联网路径（那时再忍受那个 403）。
      - name: 安装依赖包
        shell: bash
        run: |
          PKGS="switch-curl switch-zlib switch-mbedtls switch-dav1d
                switch-glfw switch-mesa switch-libwebp switch-freetype switch-harfbuzz
                switch-libpng switch-libjpeg-turbo switch-libass switch-liblua51
                switch-libplacebo switch-glm switch-glad switch-bzip2 switch-liblzma
                switch-pkg-config switch-tools switch-cmake dkp-toolchain-vars"

          missing=""
          for p in $PKGS; do
            if ! dkp-pacman -Q "$p" >/dev/null 2>&1; then missing="$missing $p"; fi
          done

          if [ -z "$missing" ]; then
            echo "镜像里依赖已齐全，跳过联网同步"
          else
            echo "缺少:$missing —— 需要联网同步（源站 403 是间歇性的）"
            for attempt in 1 2 3 4 5 6; do
              if dkp-pacman -Sy --noconfirm; then
                echo "数据库同步成功（第 $attempt 次）"
                break
              fi
              echo "第 $attempt 次同步失败，15 秒后重试…"
              sleep 15
              if [ "$attempt" = "6" ]; then echo "六次都失败，放弃"; exit 1; fi
            done
            dkp-pacman -S --noconfirm --needed $missing
          fi

          # 真正的判据是 pkg-config 描述文件在不在 —— 缺了要在这里就报出来，
          # 不能拖到 cmake 阶段变成一个看不懂的 find_package 失败。
          for pc in libcurl dav1d libass freetype2 harfbuzz libpng libjpeg libwebp \
                    liblzma zlib mbedtls lua51 libplacebo glfw3 libglad; do
            if [ ! -f "/opt/devkitpro/portlibs/switch/lib/pkgconfig/$pc.pc" ]; then
              echo "缺少 pkg-config 描述文件: $pc.pc"; exit 1
            fi
          done
          echo "依赖自检通过"

      # ⚠ 这四个包都不在 devkitPro 官方源里，是 wiliwili 托管在 GitHub releases 上的：
      #     ffmpeg / libmpv —— devkitPro 自带的版本不支持网络流（我们要播本地代理的 HTTP 流）
      #     nspmini / hacBrewPack —— 生成「装到主页」用的 forwarder
      #   把它们写进 dkp-pacman -S 会报 "target not found" 而整步失败。
      # ⚠ 必须显式指定 bash。devkitpro 容器里的默认 shell 是 /bin/sh（dash），
      #   而下面的 PKGS=(...) 数组语法 dash 不认识，会报 Syntax error: "(" unexpected。
      - name: 安装 wiliwili 定制包
        shell: bash
        run: |
          BASE="https://github.com/xfangfang/wiliwili/releases/download/v0.1.0"
          PKGS=(
            switch-ffmpeg-7.1-1-any.pkg.tar.zst
            switch-libmpv-0.36.0-3-any.pkg.tar.zst
            switch-nspmini-48d4fc2-1-any.pkg.tar.xz
            hacBrewPack-3.05-1-any.pkg.tar.zst
          )
          for PKG in "${PKGS[@]}"; do
            # -L 不能少：GitHub release 的下载会 302 跳到 objects.githubusercontent.com
            # -C - 断点续传：11MB 的 ffmpeg 包在网络抖动时容易被截断，
            #       截断的包 dkp-pacman 会报损坏，且错误信息完全不提"下载不完整"。
            # --max-time 给足 30 分钟，慢也比失败强。
            for attempt in 1 2 3; do
              curl -sSL -C - --retry 3 --retry-delay 5 --max-time 1800 -o "$PKG" "$BASE/$PKG" && break
              echo "第 $attempt 次下载未完成，重试…"
              sleep 5
            done
            test -s "$PKG" || { echo "下载失败: $PKG"; exit 1; }
            dkp-pacman -U --noconfirm "$PKG"
          done

      - name: 打印工具链版本
        run: aarch64-none-elf-gcc --version | head -1

      - name: 构建 .nro
        working-directory: wiliwili
        env:
          PKG_CONFIG_PATH: /opt/devkitpro/portlibs/switch/lib/pkgconfig
          PKG_CONFIG_LIBDIR: /opt/devkitpro/portlibs/switch/lib/pkgconfig
        run: |
          cmake -B cmake-build-switch \
                -DCMAKE_BUILD_TYPE=Release \
                -DPLATFORM_SWITCH=ON \
                -DBRLS_UNITY_BUILD=ON \
                -DBUILTIN_NSP=ON
          # ⚠ 构建的 target 名是 wiliwili.nro（沿用 CMake 的 PROJECT_NAME），
          #   产物文件名才是 hongguo.nro —— 两者不同，别搞混。
          make -C cmake-build-switch wiliwili.nro -j"$(nproc)"

      - name: 检查产物
        working-directory: wiliwili
        run: |
          ls -la cmake-build-switch/hongguo.nro
          test -s cmake-build-switch/hongguo.nro
          # NRO 的魔数在偏移 0x10（头部设计如此，不是文件开头）
          test "$(dd if=cmake-build-switch/hongguo.nro bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"

      # 「装到主页」那个 forwarder 的名字与图标是烤进 NSP 里的，
      # 一旦配错只能靠真机发现。这里在构建期就把它的元信息打出来。
      - name: 校验 forwarder 的应用名与图标
        shell: bash
        working-directory: wiliwili
        run: |
          NACP=$(find cmake-build-switch -name control.nacp | head -1)
          ICON=$(find cmake-build-switch -name "icon_*.dat" | head -1)
          echo "nacp: $NACP"
          echo "icon: $ICON"
          if [ -n "$NACP" ]; then
            echo "forwarder 显示名: $(head -c 64 "$NACP" | tr -d '\000')"
            echo "forwarder 作者:   $(dd if="$NACP" bs=1 skip=512 count=64 2>/dev/null | tr -d '\000')"
          fi
          # 图标应当是 hongguo.jpg 而不是 wiliwili 的 icon.jpg
          if [ -n "$ICON" ]; then
            echo "forwarder 图标大小: $(stat -c%s "$ICON") 字节（hongguo.jpg 应为 8072）"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-nro
          path: wiliwili/cmake-build-switch/hongguo.nro
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wiliwili/cmake-build-switch/hongguo.nro
          generate_release_notes: true
